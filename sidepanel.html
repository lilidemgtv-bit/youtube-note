<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Note</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Note: the panel's own "YouTube Note" title is shown by Chrome's side-panel
         title bar, so we don't repeat a logo here. -->
    <div class="header">
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-title-zh" id="videoTitleZh"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <button
          class="settings-btn"
          id="settingsBtn"
          type="button"
          title="打开 YouTube Note 设置"
          aria-label="打开 YouTube Note 设置"
        >
          设置
        </button>
      </div>

      <!-- Tab navigation -->
      <div class="tabs" id="tabsNav" style="display: none">
        <button class="tab active" data-tab="transcript">字幕</button>
        <button class="tab" data-tab="overview">概览</button>
        <button class="tab" data-tab="notes">笔记</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon">&#9655;</div>
        <div class="welcome-title">准备生成摘要</div>
        <div class="welcome-desc">
          打开一个 YouTube 视频，然后点击扩展图标即可生成 AI 摘要。
        </div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" style="display: none">
        <div class="loading-container">
          <div class="loading-bar"></div>
          <div class="loading-text" id="loadingText">正在获取字幕</div>
          <div class="loading-subtext" id="loadingSubtext">
            正在从视频中提取字幕...
          </div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" style="display: none">
        <div class="error-container">
          <div class="error-icon">&#9888;</div>
          <div class="error-title" id="errorTitle">出错了</div>
          <div class="error-message" id="errorMessage">
            出了点问题。
          </div>
          <button class="error-btn" id="errorBtn">重试</button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div class="tab-panel active" data-panel="transcript">
          <div class="section">
            <div class="section-header transcript-section-header">
              <div class="transcript-header-main">
                <div class="section-title-wrap">
                  <div class="section-title">完整字幕</div>
                </div>
                <div
                  class="transcript-mode-control"
                  id="transcriptModeControl"
                  role="group"
                  aria-label="Transcript language"
                >
                  <button
                    class="transcript-mode-btn active"
                    type="button"
                    data-transcript-mode="original"
                    aria-pressed="true"
                  >原文</button>
                  <button
                    class="transcript-mode-btn"
                    type="button"
                    data-transcript-mode="zh"
                    aria-pressed="false"
                  >中文</button>
                  <button
                    class="transcript-mode-btn"
                    type="button"
                    data-transcript-mode="bilingual"
                    aria-pressed="false"
                  >双语</button>
                  <span
                    class="translation-spinner"
                    id="langSpinner"
                    aria-label="Translating"
                  ></span>
                </div>
              </div>
              <div class="transcript-actions">
                <button class="enhance-btn" id="copyTranscriptBtn">复制</button>
                <button class="enhance-btn" id="exportTranscriptBtn">
                  导出
                </button>
              </div>
            </div>
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (chapters + key quotes) - requires LLM -->
        <div class="tab-panel" data-panel="overview">
          <div class="section-header transcript-section-header">
            <div
              class="transcript-mode-control"
              id="overviewModeControl"
              role="group"
              aria-label="Overview language"
            >
              <button
                class="overview-mode-btn"
                type="button"
                data-overview-mode="original"
                aria-pressed="false"
              >原文</button>
              <button
                class="overview-mode-btn active"
                type="button"
                data-overview-mode="zh"
                aria-pressed="true"
              >中文</button>
              <button
                class="overview-mode-btn"
                type="button"
                data-overview-mode="bilingual"
                aria-pressed="false"
              >双语</button>
            </div>
          </div>
          <!-- Video Summary -->
          <div class="section">
            <div class="section-title">视频简介</div>
            <div class="video-summary" id="videoSummary">
              视频简介将在生成概览后显示。
            </div>
          </div>
          <!-- Chapters -->
          <div class="section">
            <div class="section-title">章节</div>
            <ul class="chapter-list" id="chapterList">
              <li
                class="chapter-item"
                style="
                  color: var(--text-muted);
                  cursor: default;
                  border-color: var(--border);
                "
              >
                章节将显示在这里
              </li>
            </ul>
          </div>

          <!-- Key Quotes -->
          <div class="section">
            <div class="section-title">重点引言</div>
            <div id="quotesList">
              <div
                class="quote-item"
                style="
                  color: var(--text-muted);
                  border-left-color: var(--border);
                  cursor: default;
                "
              >
                <div class="quote-text" style="font-style: normal">
                  查看此标签页时将提取引言...
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: Notes -->
        <div class="tab-panel" data-panel="notes">
          <div class="section">
            <div class="section-header">
              <div class="section-title">已保存的笔记</div>
              <div
                class="transcript-mode-control"
                id="notesModeControl"
                role="group"
                aria-label="Note language"
              >
                <button
                  class="notes-mode-btn"
                  type="button"
                  data-notes-mode="original"
                  aria-pressed="false"
                >原文</button>
                <button
                  class="notes-mode-btn active"
                  type="button"
                  data-notes-mode="zh"
                  aria-pressed="true"
                >中文</button>
                <button
                  class="notes-mode-btn"
                  type="button"
                  data-notes-mode="bilingual"
                  aria-pressed="false"
                >双语</button>
              </div>
              <div class="notes-filter">
                <button
                  class="enhance-btn active"
                  id="notesFilterThis"
                  aria-pressed="true"
                >
                  本视频
                </button>
                <button
                  class="enhance-btn"
                  id="notesFilterAll"
                  aria-pressed="false"
                >
                  全部笔记
                </button>
              </div>
            </div>
            <p class="notes-intro" id="notesIntro">
              播放时暂停视频并点击 📝 笔记 按钮，或按 “n” 键保存。
            </p>
            <div id="notesList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Auto-scroll follow button — appears when user scrolls away from playback position -->
    <button
      class="follow-playback-btn"
      id="followPlaybackBtn"
      style="display: none"
    >
      Follow playback
    </button>

    <script src="settings.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
